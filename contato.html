<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
</head>
<body>
    <form action="" method="get">
        <label for="nome">Qual seu nome?</label>
        <input type="text" name="nome" id="nome" placeholder="Digite seu nome" required>
        <label for="email">Qual seu e-mail?</label>
        <input type="text" name="email" id="email" placeholder="Digite seu e-mail" required>
        <label for="notas">Oque você achou do site?</label>
        <select name="notas" id="notas">
            <option value="bom">BOM</option>
            <option value="medio">MÉDIO</option>
            <option value="ruim">RUÍM</option>
        </select>
        <label for="sugestao">Qual a sua sugestão de melhoria?</label>
        <textarea name="sugetao" id="sugestao" placeholder="Digite sua sugestão aqui!"></textarea>
        <input type="checkbox" name="termos" id="aceitar">
        <label for="termos">Eu aceito os termos e condições!</label>
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
